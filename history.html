<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nobita Hack 💀 | History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');
        body { background: #05070a; color: white; font-family: sans-serif; }
        .hacker-font { font-family: 'Orbitron', sans-serif; }
        .card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .win-glow { border-left: 4px solid #10b981; box-shadow: -10px 0 20px rgba(16, 185, 129, 0.1); }
        .loss-glow { border-left: 4px solid #ef4444; box-shadow: -10px 0 20px rgba(239, 68, 68, 0.1); }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-4">
            <h1 class="hacker-font text-xl text-yellow-400 italic">Nobita <span class="text-white">History 💀</span></h1>
            <button onclick="window.location.href='index.html'" class="text-[9px] font-bold bg-white/5 px-4 py-2 rounded-full uppercase">Back</button>
        </div>

        <div id="historyContainer" class="space-y-3">
            <div class="text-center py-20 animate-pulse text-gray-600 text-xs uppercase tracking-widest">Scanning Records...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

        // Firebase Config (Same as your database.js)
        const firebaseConfig = { /* Paste your config here */ };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const userKey = localStorage.getItem('active_key');
        const container = document.getElementById('historyContainer');

        async function fetchRealResults() {
            const res = await fetch("https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json");
            const json = await res.json();
            return json.data.list;
        }

        async function loadHistory() {
            const realData = await fetchRealResults();
            const historyRef = ref(db, `user_history/${userKey}`);

            onValue(historyRef, (snapshot) => {
                if (!snapshot.exists()) {
                    container.innerHTML = "<p class='text-center text-gray-700 mt-10 uppercase text-[10px]'>No Hacks Found</p>";
                    return;
                }

                container.innerHTML = "";
                const records = snapshot.val();

                Object.values(records).reverse().forEach(record => {
                    // Match with real API result
                    const actualMatch = realData.find(d => d.issueNumber == record.period);
                    let actualSize = "---";
                    let status = "JK 🎲";
                    let glowClass = "";
                    let statusColor = "text-gray-400";

                    if (actualMatch) {
                        actualSize = actualMatch.number >= 5 ? "BIG" : "SMALL";
                        if (record.prediction === actualSize) {
                            status = "WIN 🐯";
                            glowClass = "win-glow";
                            statusColor = "text-emerald-500";
                        } else {
                            status = "LOSS 💀";
                            glowClass = "loss-glow";
                            statusColor = "text-red-500";
                        }
                    }

                    container.innerHTML += `
                        <div class="card p-4 rounded-2xl ${glowClass} flex justify-between items-center">
                            <div class="space-y-1">
                                <p class="text-[8px] text-gray-500 font-bold uppercase">Period: ${record.period.toString().slice(-3)}</p>
                                <div class="flex items-center gap-3">
                                    <span class="text-xs font-bold text-white/40 italic">PRED: ${record.prediction}</span>
                                    <span class="text-xs font-bold text-white italic">REAL: ${actualSize}</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="hacker-font text-[10px] ${statusColor} mb-1">${status}</p>
                                <p class="text-[7px] text-gray-700 font-bold">${record.time}</p>
                            </div>
                        </div>
                    `;
                });
            });
        }

        loadHistory();
    </script>
</body>
</html>
