<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nobita History 💀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap');
        
        body { background-color: #0d1117; color: white; font-family: sans-serif; overflow-x: hidden; }
        .sync-glow { font-family: 'Syncopate', sans-serif; font-weight: 700; color: #ff3c73; text-shadow: 0 0 15px #ff3c73; }
        .dashboard-shell { background-color: rgba(22, 27, 34, 0.95); border-radius: 40px; border: 1px solid #30363d; }
        
        /* History Items Styling */
        .history-item { background: #161b22; border-radius: 20px; border: 1px solid #30363d; margin-bottom: 20px; transition: 0.3s; }
        .history-item:hover { border-color: #10b981; }
        .win-gradient { background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), transparent); border-left: 4px solid #10b981; }
        .retry-gradient { background: linear-gradient(135deg, rgba(139, 148, 158, 0.1), transparent); border-left: 4px solid #8b949e; }
    </style>
</head>
<body oncontextmenu="return false">

<div class="min-h-screen p-4 pt-10 pb-20">
    
    <div class="dashboard-shell p-10 max-w-sm mx-auto shadow-2xl relative mb-10">
        <a href="index.html" class="absolute top-5 right-5 text-gray-500 p-2">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </a>
        <div class="mb-10 text-center">
            <h1 class="sync-glow text-3xl mb-1">NOBITA HACK 💀</h1>
            <p class="text-[#fffb13] text-xs uppercase tracking-widest">History records link neural secure cloud</p>
        </div>
    </div>

    <div id="historyList" class="space-y-5 max-w-sm mx-auto">
        <div class="text-center text-gray-700 mt-20 p-10 uppercase tracking-widest text-[10px]">Cloud history storage linking...</div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

    // Use same Firebase Config as database.js
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const container = document.getElementById('historyList');

    async function loadHistory() {
        container.innerHTML = '<div class="text-center text-gray-700 mt-20 animate-pulse text-[10px] uppercase tracking-widest">Syncing History neural verified link</div>';
        
        // Link to cloud verified history folder in your database
        const snapshot = await get(ref(db, 'viper_history'));
        
        if (!snapshot.exists()) {
            container.innerHTML = '<div class="text-center text-gray-700 mt-20">No Cloud history verified on secure link V15</div>';
            return;
        }

        container.innerHTML = "";
        const data = snapshot.val();
        
        // Loop through each history record and apply VIP Tiger styling from image
        Object.keys(data).forEach(period => {
            let record = data[period];
            
            let html = `
                <div class="history-item p-6 ${record.status.includes('WIN') ? 'win-gradient' : 'retry-gradient'}">
                    <div class="flex justify-between items-center">
                        <div class="space-y-1">
                            <p class="text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1">PRD: ${period.toString().slice(-3)}</p>
                            <div class="flex gap-4 items-center">
                                <span class="hacker-font text-xs text-white/50 uppercase italic font-bold">PRED: ${record.pred}</span>
                                <span class="hacker-font text-xl text-white font-black">${record.num}</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="hacker-font text-xs ${record.status.includes('WIN') ? 'text-green-500' : 'text-gray-500'} italic mb-1">${record.status}</p>
                            <p class="text-[8px] text-gray-700 font-bold">${record.time || 'Neural Verified'}</p>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    loadHistory();
    document.addEventListener('contextmenu', e => e.preventDefault());
</script>

</body>
</html>
