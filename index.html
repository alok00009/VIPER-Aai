<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER AI | UDAY VIP Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Orbitron:wght@900&display=swap');
        
        body { background-color: #0d1117; color: white; font-family: sans-serif; overflow-x: hidden; }
        .hidden { display: none !important; }
        .glow-green { color: #10b981; text-shadow: 0 0 10px #10b981, 0 0 20px #10b981; }
        .dashboard-shell { background-color: rgba(22, 27, 34, 0.95); border-radius: 40px; border: 1px solid #30363d; }
        
        /* Premium Category Nav Styling */
        .bottom-nav { background: #161b22; border-top: 1px solid #30363d; }
        .category-tab { color: #8b949e; cursor: pointer; transition: 0.3s; }
        .category-tab.active { color: #10b981; }
        
        /* Prediction Elements Styling */
        .sync-glow { font-family: 'Syncopate', sans-serif; font-weight: 700; color: #ff3c73; text-shadow: 0 0 15px #ff3c73; }
        .size-display { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 8rem; line-height: 1; margin: 20px 0; }
    </style>
</head>
<body oncontextmenu="return false">

<div id="loadingPage" class="fixed inset-0 bg-[#0d1117] flex items-center justify-center z-50">
    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-[#10b981]"></div>
</div>

<div id="dashboardPage" class="hidden min-h-screen pb-20 p-4 pt-10">
    
    <div class="dashboard-shell p-10 max-w-sm mx-auto shadow-2xl">
        <div class="mb-10 text-center">
            <h1 class="sync-glow text-3xl mb-1">VIPER AI</h1>
            <p class="text-[#fffb13] text-xs uppercase tracking-widest">Strict Logic V15</p>
        </div>

        <div id="predictionContent" class="hidden text-center">
            <div id="predictionData" class="space-y-6">
                </div>
            <button id="predictBtn" class="bg-emerald-600 w-full mt-10 py-5 rounded-3xl font-bold uppercase tracking-widest text-white shadow-xl">Inject Prediction</button>
        </div>

        <div id="categoryPlaceholder" class="text-center text-gray-600 mt-20 p-10 border-2 border-dashed border-gray-800 rounded-3xl">
            Click 'Predict' in categories to start VIP Logic V15
        </div>
    </div>

</div>

<div id="authPage" class="hidden min-h-screen bg-[#0d1117] flex items-center justify-center p-6">
    <div class="dashboard-shell p-10 max-w-sm w-full shadow-2xl text-center">
        <h1 class="sync-glow text-3xl mb-10">Viper VIP</h1>
        <p class="Dashboard system for paid users.</p>
        <button id="authBtn" class="bg-[#238636] w-full py-5 rounded-full font-bold uppercase tracking-widest text-white mt-10 shadow-lg">Login with Firebase</button>
    </div>
</div>

<nav class="bottom-nav fixed bottom-0 left-0 right-0 p-4 h-20 flex justify-around items-center z-40">
    <div class="category-tab active text-center flex flex-col items-center">
        <svg class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="text-[10px] font-bold uppercase">Home</span>
    </div>
    <div id="openPredictionTab" class="category-tab text-center flex flex-col items-center">
        <svg class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        <span class="text-[10px] font-bold uppercase tracking-widest">Predict</span>
    </div>
    <a href="history.html" class="category-tab text-center flex flex-col items-center">
        <svg class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="text-[10px] font-bold uppercase tracking-widest">History</span>
    </a>
    <a href="#" id="logoutBtn" class="category-tab text-center flex flex-col items-center">
        <svg class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        <span class="text-[10px] font-bold uppercase tracking-widest">Logout</span>
    </a>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script type="module" src="database.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
