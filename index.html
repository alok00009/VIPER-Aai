<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDAY VIP | V15 FINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Orbitron:wght@900&display=swap');
        :root { --main-green: #10b981; --main-red: #ff3c73; --bg-dark: #0a0c14; }
        body { background: var(--bg-dark); color: white; font-family: sans-serif; }
        .shell { background: rgba(18, 21, 30, 0.98); border-radius: 40px; border: 1px solid rgba(255,255,255,0.05); }
        .glow-title { font-family: 'Syncopate', sans-serif; text-shadow: 0 0 15px var(--main-red); color: var(--main-red); }
        .prediction-text { font-family: 'Orbitron', sans-serif; font-weight: 900; }
        .size-glow-big { text-shadow: 0 0 25px var(--main-red); color: var(--main-red); }
        .size-glow-small { text-shadow: 0 0 25px var(--main-green); color: var(--main-green); }
        .hidden { display: none !important; }
        .history-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <div id="keyOverlay" class="fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center p-6">
        <h1 class="glow-title text-2xl mb-8 uppercase">Device Authorization</h1>
        <input type="text" id="accessKey" placeholder="ENTER ACCESS KEY" class="w-full max-w-xs bg-gray-900 border border-red-500/30 p-4 rounded-xl text-center outline-none mb-4">
        <button id="authBtn" class="bg-red-600 px-10 py-3 rounded-xl font-bold uppercase tracking-widest active:scale-95">Verify</button>
    </div>

    <div id="mainApp" class="hidden shell p-8 w-full max-w-sm text-center relative mt-4">
        <h1 class="glow-title text-3xl font-black mb-1 italic">UDAY VIP</h1>
        <p class="text-[#fffb13] text-[9px] uppercase tracking-[0.3em] mb-10 italic">Strict Logic V15</p>

        <div class="bg-black/40 rounded-[40px] py-12 border border-white/5 mb-6 relative">
            <div id="aiLoader" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center rounded-[40px] z-20">
                <div class="w-8 h-8 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
            
            <p id="nextPeriod" class="text-[10px] text-gray-400 font-bold uppercase mb-2">Next: Loading...</p>
            <div id="wRes" class="prediction-text text-8xl">---</div>
            
            <div class="mt-8 px-6">
                <div class="border border-dashed border-yellow-500/30 py-4 rounded-xl">
                    <p class="text-[9px] text-gray-400 uppercase mb-1">Opposite Nums</p>
                    <div id="opNums" class="text-yellow-400 font-black text-xl">-</div>
                </div>
            </div>
        </div>

        <button id="btnPredict" class="w-full bg-emerald-600 py-6 rounded-3xl font-black text-[10px] uppercase tracking-[0.4em] mb-4 active:scale-95">Link AI Prediction</button>
        
        <button id="historyToggle" class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-4">View History</button>
        <div id="historyPanel" class="hidden history-card p-4 text-[10px] max-h-40 overflow-y-auto">
            <table class="w-full text-center">
                <thead>
                    <tr class="text-gray-500 border-b border-white/5">
                        <th class="pb-2">PRD</th>
                        <th class="pb-2">PRED</th>
                        <th class="pb-2">NUM</th>
                        <th class="pb-2">STATUS</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="database.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
