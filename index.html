<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nobita Hack 💀 | V15</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Orbitron:wght@900&display=swap');
        :root { --neon-yellow: #fffb13; --neon-red: #ff3c73; --bg: #05070a; }
        body { background: var(--bg); color: white; font-family: sans-serif; user-select: none; }
        .shell { background: rgba(15, 17, 26, 0.98); border-radius: 40px; border: 1px solid rgba(255,255,255,0.05); }
        .nobita-title { font-family: 'Syncopate', sans-serif; text-shadow: 0 0 15px var(--neon-red); color: var(--neon-red); }
        .hacker-font { font-family: 'Orbitron', sans-serif; }
        .glow-yellow { text-shadow: 0 0 10px var(--neon-yellow); color: var(--neon-yellow); }
        .hidden { display: none !important; }
        .history-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; transition: 0.3s; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-red); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <div id="keyOverlay" class="fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center p-6 text-center">
        <h1 class="nobita-title text-2xl mb-8 uppercase italic">Nobita Auth 💀</h1>
        <input type="text" id="accessKey" placeholder="ENTER ACCESS KEY" class="w-full max-w-xs bg-gray-900 border border-red-500/30 p-5 rounded-2xl text-center outline-none mb-4 font-bold text-red-500 uppercase">
        <button id="authBtn" class="bg-red-600 w-full max-w-xs py-4 rounded-2xl font-black uppercase tracking-widest active:scale-95 transition-all">Unlock Access</button>
    </div>

    <div id="mainApp" class="hidden w-full max-w-sm">
        <div class="shell p-8 text-center relative shadow-2xl shadow-red-900/20 mb-6">
            <h1 class="nobita-title text-3xl font-black mb-1 italic">Nobita Hack</h1>
            <p class="glow-yellow text-[9px] uppercase tracking-[0.4em] mb-10 italic">Strict Logic V15</p>

            <div class="bg-black/50 rounded-[40px] py-12 border border-white/5 mb-8 relative">
                <div id="aiLoader" class="hidden absolute inset-0 bg-black/95 flex flex-col items-center justify-center rounded-[40px] z-20 text-red-600">
                    <div class="w-10 h-10 border-2 border-current border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-[8px] font-bold uppercase mt-4 tracking-widest">Injecting Neural V15...</span>
                </div>
                
                <p id="nextPeriod" class="text-[10px] text-gray-500 font-bold uppercase mb-2 tracking-widest">Syncing API...</p>
                <div id="wRes" class="hacker-font text-8xl transition-all duration-300">---</div>
                
                <div class="mt-8 px-6">
                    <div class="border border-dashed border-yellow-500/20 py-4 rounded-2xl">
                        <p class="text-[8px] text-gray-500 uppercase font-black mb-1">Opposite Nodes</p>
                        <div id="opNums" class="glow-yellow font-black text-2xl">-</div>
                    </div>
                </div>
            </div>

            <button id="btnPredict" class="w-full bg-red-600 py-6 rounded-3xl font-black text-[10px] uppercase tracking-[0.4em] active:scale-95 shadow-lg shadow-red-900/30">Execute Hack</button>
        </div>

        <div class="shell p-6 bg-black/40">
            <div class="flex justify-between items-center mb-6 px-2">
                <h2 class="hacker-font text-xs text-white uppercase italic tracking-widest">Hack History 💀</h2>
                <span class="text-[7px] text-gray-600 font-bold uppercase">Cloud Records</span>
            </div>
            <div id="historyList" class="space-y-3 max-h-[350px] overflow-y-auto pr-2">
                <p class="text-center py-10 text-gray-800 text-[9px] font-black uppercase animate-pulse">Scanning Neural Link...</p>
            </div>
        </div>
    </div>

    <script type="module" src="database.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
