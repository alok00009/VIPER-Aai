<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER AI | Super Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; font-family: 'Poppins', sans-serif; p: 20px; }
        .glass-card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }
        input, select { background: #0f172a !important; border: 1px solid #1e293b !important; color: white; outline: none; padding: 10px; border-radius: 10px; width: 100%; margin-top: 5px; }
        .key-row { border-bottom: 1px solid #1e293b; font-size: 11px; }
        .btn-sm { padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 10px; }
    </style>
</head>
<body class="p-4">

<div class="max-w-6xl mx-auto">
    <header class="flex justify-between items-center mb-8 py-4 border-b border-slate-800">
        <h1 class="text-xl font-black text-cyan-400 uppercase tracking-tighter">Viper Master Control</h1>
        <div class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Device Lock & Expiry Active</div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <div class="lg:col-span-1 glass-card p-6 h-fit sticky top-4">
            <h2 class="text-xs font-bold text-gray-400 mb-6 uppercase tracking-widest">Create License</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] uppercase text-gray-500">Plan Type</label>
                    <select id="planSelect">
                        <option value="silver">ðŸ¥ˆ Silver Plan</option>
                        <option value="gold">ðŸ¥‡ Gold Plan</option>
                        <option value="diamond">ðŸ’Ž Diamond Plan</option>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] uppercase text-gray-500">Validity (Days)</label>
                    <select id="validitySelect">
                        <option value="1">1 Day (Trial)</option>
                        <option value="7">7 Days (Weekly)</option>
                        <option value="30">30 Days (Monthly)</option>
                        <option value="365">365 Days (Yearly)</option>
                    </select>
                </div>

                <button onclick="generateKey()" class="w-full bg-cyan-600 hover:bg-cyan-500 py-4 rounded-xl font-bold mt-4 shadow-lg shadow-cyan-900/40 uppercase text-xs">
                    Generate Key
                </button>
            </div>
        </div>

        <div class="lg:col-span-3 glass-card p-6">
            <h2 class="text-xs font-bold text-gray-400 mb-6 uppercase tracking-widest">Active Database</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-gray-500 text-[10px] uppercase border-b border-slate-800">
                            <th class="pb-3">License Key</th>
                            <th class="pb-3">Plan</th>
                            <th class="pb-3">Expiry</th>
                            <th class="pb-3">Device ID</th>
                            <th class="pb-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="keyListBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD6f_ghtCQP2q41QXGkld1l8KhX6z7mYgU",
        authDomain: "fuck-u-1fd9c.firebaseapp.com",
        databaseURL: "https://fuck-u-1fd9c-default-rtdb.firebaseio.com",
        projectId: "fuck-u-1fd9c",
        storageBucket: "fuck-u-1fd9c.firebasestorage.app",
        appId: "1:418045703508:web:736581cc3132dab22fc4c1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. GENERATE KEY WITH EXPIRY
    window.generateKey = async () => {
        const plan = document.getElementById('planSelect').value;
        const days = parseInt(document.getElementById('validitySelect').value);
        const newKey = "VIPER-" + Math.random().toString(36).substr(2, 6).toUpperCase();
        
        // Calculate Expiry Timestamp
        const expiryDate = Date.now() + (days * 24 * 60 * 60 * 1000);

        try {
            await set(ref(db, 'keys/' + newKey), {
                plan: plan,
                status: "active",
                expiry: expiryDate,
                deviceId: "unlocked", // Initially unlocked for anyone
                createdAt: Date.now()
            });
            alert("Key: " + newKey + "\nValidity: " + days + " Day(s)");
        } catch (e) { alert("Error!"); }
    };

    // 2. LIVE LISTENER
    onValue(ref(db, 'keys'), (snapshot) => {
        const body = document.getElementById('keyListBody');
        body.innerHTML = "";
        const data = snapshot.val();
        if(!data) return;

        Object.keys(data).forEach(id => {
            const k = data[id];
            const timeLeft = Math.round((k.expiry - Date.now()) / (1000 * 60 * 60 * 24));
            const expiryText = timeLeft > 0 ? timeLeft + " Days" : "EXPIRED";
            const deviceStatus = k.deviceId === "unlocked" ? "Any" : "Locked";

            body.innerHTML += `
                <tr class="key-row">
                    <td class="py-4 font-mono font-bold text-cyan-500">${id}</td>
                    <td class="uppercase text-[10px]">${k.plan}</td>
                    <td class="text-[10px] ${timeLeft <= 0 ? 'text-red-500' : 'text-gray-300'} font-bold">${expiryText}</td>
                    <td class="text-[9px] text-gray-500 truncate max-w-[80px]">${k.deviceId}</td>
                    <td class="text-right space-x-1">
                        <button onclick="toggleLock('${id}', '${k.status}')" class="btn-sm bg-blue-600/20 text-blue-400">${k.status === 'active' ? 'LOCK' : 'OPEN'}</button>
                        <button onclick="resetDevice('${id}')" class="btn-sm bg-orange-600/20 text-orange-400">RESET ID</button>
                        <button onclick="delKey('${id}')" class="btn-sm bg-red-600/20 text-red-500 font-black">X</button>
                    </td>
                </tr>
            `;
        });
    });

    window.toggleLock = (id, s) => update(ref(db, 'keys/'+id), {status: s === 'active' ? 'locked' : 'active'});
    window.resetDevice = (id) => update(ref(db, 'keys/'+id), {deviceId: 'unlocked'});
    window.delKey = (id) => confirm("Delete Key?") && remove(ref(db, 'keys/'+id));

</script>
</body>
</html>
