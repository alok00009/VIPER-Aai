<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER AI | Key Access System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; font-family: 'Poppins', sans-serif; overflow: hidden; }
        .glass-card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; }
        .safe-tile { background: #0891b2 !important; border: 2px solid #22d3ee !important; box-shadow: 0 0 15px #22d3ee; }
        .master-card { background: linear-gradient(135deg, #1e1b4b, #312e81); border: 1px solid #4338ca; }
        input { background: #0f172a !important; border: 1px solid #1e293b !important; color: #22d3ee; outline: none; text-align: center; font-weight: bold; }
        .hidden { display: none; }
        .lock-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 24px; }
    </style>
</head>
<body oncontextmenu="return false">

<div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card p-10 w-full max-w-sm shadow-2xl border-t-4 border-cyan-500 text-center">
        <div class="text-5xl mb-6">🔑</div>
        <h1 class="text-2xl font-black text-white uppercase tracking-tighter mb-2">Viper Access</h1>
        <p class="text-gray-500 text-[10px] mb-8 uppercase tracking-[0.3em]">Enter License Key To Start</p>
        
        <input type="text" id="licenseKey" placeholder="XXXX-XXXX-XXXX" class="w-full p-4 rounded-2xl mb-6 tracking-widest uppercase">
        
        <button id="btnVerify" class="w-full bg-cyan-600 hover:bg-cyan-500 py-4 rounded-2xl font-bold uppercase shadow-lg active:scale-95 transition-all">
            Verify License
        </button>
        
        <p id="errorMsg" class="text-red-500 text-[10px] font-bold mt-4 h-4 uppercase"></p>
    </div>
</div>

<div id="dashboardPage" class="hidden container mx-auto p-4 max-w-lg min-h-screen relative pb-10 overflow-y-auto" style="height: 100vh;">
    <nav class="flex justify-between items-center mb-6 py-2 border-b border-slate-800">
        <h1 class="text-cyan-400 font-black text-xl tracking-tighter uppercase">Viper Elite</h1>
        <div class="flex gap-4 items-center">
            <span id="planBadge" class="text-[9px] font-bold px-2 py-1 rounded bg-slate-800 text-white border border-slate-700">PLAN</span>
            <button onclick="logout()" class="text-red-500 text-[10px] font-bold border border-red-500/20 px-2 py-1 rounded">EXIT</button>
        </div>
    </nav>

    <div class="master-card p-6 rounded-3xl mb-6 shadow-xl relative overflow-hidden">
        <div class="flex justify-between items-center mb-2">
            <h3 class="text-[10px] font-black text-cyan-300 uppercase tracking-widest">Admin Prediction</h3>
            <span class="animate-pulse text-red-500 text-[10px]">● LIVE</span>
        </div>
        <div id="adminMsg" class="text-lg font-bold text-white text-center py-2 italic font-mono">
            "Scanning Database..."
        </div>
    </div>

    <div class="glass-card p-6 mb-6">
        <input type="number" id="pastNo" placeholder="Last No." class="w-full p-4 rounded-2xl text-4xl font-black mb-4 bg-slate-900">
        <div class="text-center py-4 border-y border-slate-800/50 my-4">
            <div id="wRes" class="text-5xl font-black my-2">---</div>
            <div id="goldSection" class="hidden mt-4 pt-4 border-t border-slate-800">
                <div class="flex justify-center gap-4">
                    <div id="n1" class="w-11 h-11 bg-slate-800 rounded-full flex items-center justify-center font-bold border border-slate-700 text-yellow-500">-</div>
                    <div id="n2" class="w-11 h-11 bg-slate-800 rounded-full flex items-center justify-center font-bold border border-slate-700 text-yellow-500">-</div>
                    <div id="n3" class="w-11 h-11 bg-slate-800 rounded-full flex items-center justify-center font-bold border border-slate-700 text-yellow-500">-</div>
                </div>
            </div>
        </div>
        <button onclick="runWingo()" class="w-full bg-cyan-600 py-4 rounded-xl font-bold uppercase shadow-lg">Predict Next</button>
    </div>

    <div class="glass-card p-6 relative overflow-hidden h-[340px]">
        <div id="mLock" class="lock-overlay hidden">
            <span class="text-3xl mb-2">💎</span>
            <p class="text-[10px] font-bold uppercase">Diamond Key Required</p>
        </div>
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-widest">Mines Hack</h3>
            <button onclick="runMines()" class="bg-emerald-600 px-4 py-1 rounded text-[10px] font-bold uppercase">Scan</button>
        </div>
        <div id="mGrid" class="grid grid-cols-5 gap-2 h-[220px]"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD6f_ghtCQP2q41QXGkld1l8KhX6z7mYgU",
        authDomain: "fuck-u-1fd9c.firebaseapp.com",
        databaseURL: "https://fuck-u-1fd9c-default-rtdb.firebaseio.com",
        projectId: "fuck-u-1fd9c",
        storageBucket: "fuck-u-1fd9c.firebasestorage.app",
        appId: "1:418045703508:web:736581cc3132dab22fc4c1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const btnVerify = document.getElementById('btnVerify');
    const keyInput = document.getElementById('licenseKey');
    const errorMsg = document.getElementById('errorMsg');

    // KEY VERIFICATION LOGIC
    btnVerify.addEventListener('click', async () => {
        const key = keyInput.value.trim().toUpperCase();
        if(!key) return alert("Enter Key!");

        errorMsg.innerText = "VERIFYING...";
        
        try {
            const keyRef = ref(db, 'keys/' + key);
            const snapshot = await get(keyRef);

            if (snapshot.exists()) {
                const data = snapshot.val();
                localStorage.setItem('viperAuth', 'true');
                localStorage.setItem('userPlan', data.plan);
                
                startDashboard(data.plan);
            } else {
                errorMsg.innerText = "INVALID OR EXPIRED KEY!";
            }
        } catch (e) {
            errorMsg.innerText = "CONNECTION ERROR!";
        }
    });

    function startDashboard(plan) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboardPage').classList.remove('hidden');
        document.body.style.overflow = "auto";
        
        document.getElementById('planBadge').innerText = plan.toUpperCase();
        if(plan !== 'silver') document.getElementById('goldSection').classList.remove('hidden');
        if(plan === 'diamond') document.getElementById('mLock').classList.add('hidden');
        else document.getElementById('mLock').classList.remove('hidden');

        // Master Prediction Listener
        onValue(ref(db, 'admin_settings/prediction'), (snap) => {
            document.getElementById('adminMsg').innerText = snap.val() || "Wait for Admin Signal...";
        });
    }

    // Auto-Login check
    if(localStorage.getItem('viperAuth') === 'true') {
        startDashboard(localStorage.getItem('userPlan'));
    }

    window.logout = () => { localStorage.clear(); location.reload(); };
</script>

<script>
    function runWingo() {
        const n = parseInt(document.getElementById('pastNo').value);
        if(isNaN(n)) return alert("Enter Last No!");
        const res = document.getElementById('wRes');
        res.innerText = "...";
        setTimeout(() => {
            const size = (n + 3) % 10 >= 5 ? "BIG" : "SMALL";
            res.innerText = size;
            res.style.color = size === "BIG" ? "#f87171" : "#60a5fa";
            
            if(localStorage.getItem('userPlan') !== 'silver') {
                document.getElementById('n1').innerText = (n+2)%10;
                document.getElementById('n2').innerText = (n+5)%10;
                document.getElementById('n3').innerText = (n+8)%10;
            }
        }, 800);
    }

    function runMines() {
        const tiles = document.querySelectorAll('.m-tile');
        tiles.forEach(t => { t.classList.remove('safe-tile'); t.innerHTML = ""; });
        let sel = []; while(sel.length < 5) { let r = Math.floor(Math.random()*25); if(!sel.includes(r)) sel.push(r); }
        sel.forEach((idx, i) => { setTimeout(() => { tiles[idx].classList.add('safe-tile'); tiles[idx].innerHTML = "⭐"; }, i*150); });
    }

    const grid = document.getElementById('mGrid');
    for(let i=0; i<25; i++) {
        const d = document.createElement('div');
        d.className = "m-tile h-full bg-slate-900 border border-slate-800 rounded-lg flex items-center justify-center text-xl";
        grid.appendChild(d);
    }
</script>
</body>
    </html>
